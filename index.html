<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Selected Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Geist:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<section class="hero-section">
    <div class="hero-content">
        <h1>Selected Interior & Exterior Projects</h1>
        <p>We approach interior and exterior design with a focus on lifestyle, context, and long-term value. We approach interior and exterior design with a focus on lifestyle, context, and long-term value.</p>
    </div>
   
    <div class="showcase-container">
        <div class="carousel-controls">
            <div class="thumbnail-stack">
                <div class="thumb-item active"><img src="asset/2.svg" alt="Thumb 1"></div>
                <div class="thumb-item"><img src="asset/3.svg" alt="Thumb 2"></div>
                <div class="thumb-item"><img src="asset/4.svg" alt="Thumb 3"></div>
                <div class="thumb-item"><img src="asset/5.svg" alt="Thumb 4"></div>
            </div>
            <div class="pagination-dots">
                <span class="dot active"></span>
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <div class="main-display-frame">
            <img src="asset/1.svg" alt="Main View">
        </div>
    </div>

    <div class="filter-pills">
        <button class="pill active">Interior</button>
        <button class="pill">Exterior</button>
    </div>
</section>

</body>
</html>
